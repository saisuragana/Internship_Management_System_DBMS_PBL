{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}

<section class="section page-top">

    <div class="section-heading center">
        <span class="eyebrow">INTERNSHIPHUB</span>
        <h2>Admin Login</h2>
        <p>Sign in to manage internship opportunities.</p>
    </div>

    <div class="auth-card neu">

        {% if error %}
        <div class="alert error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >
            </div>

            <button type="submit" class="btn primary full-width">
                Login as Admin
            </button>

        </form>

    </div>

</section>

{% endblock %}
