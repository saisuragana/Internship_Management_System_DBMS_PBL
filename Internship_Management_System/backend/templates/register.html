{% extends "base.html" %}

{% block title %}Create account{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block content %}
<section class="auth-page">

    <div class="glass auth-card auth-card-wide">

        <div class="auth-icon neu">✨</div>

        <h1>Create your account</h1>
        <p class="muted">Sign up to apply for internships and track them.</p>

        {% if error %}
        <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" class="form form-grid">

            <div class="span-2">
                <label for="name">Full name</label>
                <input id="name" class="field" type="text" name="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="span-2">
                <label for="email">University email</label>
                <input id="email" class="field" type="email" name="email"
                       placeholder="your.email@university.edu" required>
            </div>

            <div>
                <label for="phone">Phone</label>
                <input id="phone" class="field" type="text" name="phone"
                       placeholder="Phone number">
            </div>

            <div>
                <label for="department">Department</label>
                <input id="department" class="field" type="text"
                       name="department" placeholder="CSE, AIML, ..." required>
            </div>

            <div>
                <label for="year">Year</label>
                <select id="year" class="field" name="year" required>
                    <option value="">Select year</option>
                    <option value="1">1st year</option>
                    <option value="2">2nd year</option>
                    <option value="3">3rd year</option>
                    <option value="4">4th year</option>
                </select>
            </div>

            <div>
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input id="password" class="field" type="password"
                           name="password" placeholder="At least 6 characters"
                           minlength="6" autocomplete="new-password" required>
                    <button type="button" class="pw-toggle" data-toggle-password
                            aria-label="Show or hide password">👁</button>
                </div>
            </div>

            <div class="span-2">
                <button type="submit" class="btn btn-block">Create account</button>
            </div>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>

    </div>

</section>
{% endblock %}
